  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#gr)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <g font-family="JetBrains Mono, Consolas, Menlo, monospace">
