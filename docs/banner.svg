    <text x="82" y="232" font-size="26" fill="#22d3a7">$<tspan fill="#e6edf3" dx="10">uvx pathfinder</tspan><tspan dx="14">▌</tspan></text>
    <g fill="#223140">
      <circle cx="1064" cy="52" r="9"/><circle cx="1038" cy="52" r="9"/><circle cx="1012" cy="52" r="9"/>
    </g>
    <circle cx="1064" cy="52" r="9" fill="#22d3a7"/>
    <text x="80" y="270" font-size="22" fill="#58c7ff">subfinder</text>
    <text x="200" y="270" font-size="22" fill="#58c7ff">httpx</text>
    <text x="300" y="270" font-size="22" fill="#58c7ff">nmap</text>
    <text x="396" y="270" font-size="22" fill="#58c7ff">ffuf</text>
    <text x="472" y="270" font-size="22" fill="#58c7ff">nuclei</text>
