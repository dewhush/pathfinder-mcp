<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pathfinder-mcp banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f15"/>
      <stop offset=".6" stop-color="#0d1a22"/>
      <stop offset="1" stop-color="#070c11"/>
    </linearGradient>
    <pattern id="gr" width="48" height="48" patternUnits="userSpaceOnUse">
